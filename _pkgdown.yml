url: https://mjfrigaard.github.io/stocktipr/

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, lightswitch, github]

template:
  bootstrap: 5
  light-switch: true
  theme: a11y-light
  theme-dark: a11y-dark
  bslib:
    # light mode
    body-bg:    "#FBF7EE"   # paper (cream tint)
    body-color: "#3E2A1E"   # chocolate brown
    primary:    "#2A6F77"   # teal: links, buttons
    secondary:  "#6B5A4C"   # muted brown
    success:    "#4A7A49"   # avocado (darkened for text)
    info:       "#2A6F77"   # teal
    warning:    "#E8A33D"   # harvest gold
    danger:     "#B83A4B"   # brick red
    navbar-bg:  "#1B2A41"   # midnight navy (both modes)
    code-color: "#8F3A18"   # burnt orange (darkened)
    border-color: "#E4D8B8"
    body-secondary-bg: "#F4ECD6"
    body-tertiary-bg:  "#F7F1E2"
    # dark mode
    body-bg-dark:    "#141E2E"
    body-color-dark: "#EDE3C8"
    body-secondary-bg-dark: "#1B2A41"
    body-tertiary-bg-dark:  "#1F2D44"
    border-color-dark: "#2E3F5C"
    link-color-dark:       "#7FBFC6"
    link-hover-color-dark: "#E8A33D"
    code-color-dark: "#F0B865"
    base_font:
      google: IBM Plex Sans
    heading_font:
      google: IBM Plex Sans Condensed
    code_font:
      google: IBM Plex Mono

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - tooltips-hover-info
  - title: "Deep dives"
    navbar: ~
    contents:
      - design
      - implementation
      - logger-namespaces
      - modules
      - structure
      - theme

reference:
  - title: "App"
    desc: "Entry points for creating and running the Shiny application."
    contents:
      - launch
      - app_ui
      - app_server

  - title: "Theme"
    desc: "Dark, Bloomberg-terminal styling applied to the app UI."
    contents:
      - stocktipr_theme

  - title: "Modules"
    desc: >
      Shiny modules following the `mod_<name>_ui()` / `mod_<name>_server()`
      convention. Each pair is co-located in a single `mod_<name>.R` file.
    contents:
      - mod_inputs_ui
      - mod_inputs_server
      - mod_outputs_ui
      - mod_outputs_server
      - mod_download_ui
      - mod_download_server

  - title: "Tooltip helpers"
    desc: >
      UI and rendering helpers for attaching tooltip and hover content.
      `mod_tooltip()` targets UI elements; `mod_hoverinfo()` targets
      `reactable` table cells.
    contents:
      - mod_tooltip
      - mod_hoverinfo

  - title: "Logic"
    desc: "Financial data retrieval and transformation functions."
    contents:
      - get_stock_prices
      - get_stock_returns
      - get_ff3_factors
      - compute_rolling_vol
      - summarise_performance
      - default_tickers

  - title: "Utilities"
    desc: "Logging helpers and operators."
    contents:
      - app_set_log_threshold
      - with_logging
      - "%||%"
